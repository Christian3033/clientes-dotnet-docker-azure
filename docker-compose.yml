services:
  api:
    image: api-clientes:latest
    build: ./ApiEmpresa
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ConexionSQLAzure: ${AZURE_SQL_CONNECTION_STRING:?Configure AZURE_SQL_CONNECTION_STRING en .env}
    restart: unless-stopped
  frontend:
    image: blazor-clientes:latest
    build: ./BlazorClientes
    ports:
      - "8081:8080"
    environment:
      API_UPSTREAM: http://api:8080
    depends_on:
      - api
    restart: unless-stopped

